<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>英単語カード</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>英単語カード</h1>
    <span id="counter" class="counter">0 / 0</span>
  </header>

  <div class="toolbar">
    <button id="shuffleBtn" class="chip">🔀 シャッフル</button>
    <label class="chip toggle"><input type="checkbox" id="onlyNotYet"> 「まだ」だけ</label>
  </div>

  <main>
    <div id="card" class="card" role="button" tabindex="0" aria-label="タップして裏返す">
      <div class="card-inner">
        <div class="face front">
          <p id="phrase" class="phrase"></p>
          <p class="hint">タップして答えを見る</p>
        </div>
        <div class="face back">
          <p id="translation" class="translation"></p>
          <div id="note" class="note"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="grade" class="grade" hidden>
    <button id="notYetBtn" class="btn ng">まだ</button>
    <button id="knownBtn" class="btn ok">覚えた</button>
  </div>

  <nav class="controls">
    <button id="prevBtn" class="btn">← 前へ</button>
    <button id="nextBtn" class="btn primary">次へ →</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
