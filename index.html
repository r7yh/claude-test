<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>英単語カード</title>
  <link rel="stylesheet" href="style.css?v=dev">
  <script>window.APP_VERSION = 'dev';</script>
</head>
<body>
  <header class="topbar">
    <h1>英単語カード</h1>
    <button id="syncBtn" class="sync-btn" aria-label="同期">☁️<span id="syncDot" class="sync-dot"></span></button>
    <span id="remaining" class="remaining">今日の残り <b id="remainingNum">0</b> 枚</span>
  </header>

  <div class="toolbar">
    <span id="breakdown" class="breakdown"></span>
    <button id="shuffleBtn" class="chip">🔀 シャッフル</button>
    <button id="frontLangBtn" class="chip">表：日本語</button>
    <label class="chip">新規/日 <input type="number" id="newLimit" min="0" max="999" inputmode="numeric"></label>
  </div>

  <main>
    <div id="card" class="card" role="button" tabindex="0" aria-label="タップして裏返す">
      <div class="card-inner">
        <div class="face front">
          <p id="front" class="phrase"></p>
          <p class="hint">タップして答えを見る</p>
        </div>
        <div class="face back">
          <p id="answer" class="translation"></p>
          <p id="sub" class="sub"></p>
          <div id="note" class="note"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="grade" class="grade" hidden>
    <button class="btn g-again" data-grade="0">もう一度<small data-preview="0"></small></button>
    <button class="btn g-hard"  data-grade="1">難しい<small data-preview="1"></small></button>
    <button class="btn g-good"  data-grade="2">普通<small data-preview="2"></small></button>
    <button class="btn g-easy"  data-grade="3">簡単<small data-preview="3"></small></button>
  </div>

  <nav id="controls" class="controls">
    <button id="prevBtn" class="btn">← 前へ</button>
    <button id="nextBtn" class="btn primary">次へ →</button>
  </nav>

  <dialog id="syncDialog" class="sync-dialog">
    <form method="dialog" class="sync-close"><button aria-label="閉じる">✕</button></form>
    <h2>☁️ 端末間の同期</h2>
    <p id="syncStatus" class="sync-status"></p>

    <div id="syncLoggedOut" hidden>
      <p class="sync-help">メールアドレスにログイン用のメールを送ります。メール内のリンクを開くか、6桁のコードを入力してください。</p>
      <input id="syncEmail" type="email" placeholder="you@example.com" autocomplete="email">
      <button id="syncSendBtn" class="btn primary">ログイン用メールを送る</button>
      <div id="syncCodeArea" hidden>
        <input id="syncCode" inputmode="numeric" autocomplete="one-time-code" placeholder="6桁のコード">
        <button id="syncVerifyBtn" class="btn">コードでログイン</button>
      </div>
    </div>

    <div id="syncLoggedIn" hidden>
      <p class="sync-help"><b id="syncUserEmail"></b> でログイン中</p>
      <button id="syncNowBtn" class="btn primary">今すぐ同期</button>
      <button id="syncLogoutBtn" class="btn">ログアウト</button>
    </div>

    <p id="syncNotConfigured" class="sync-help" hidden>同期はまだ設定されていません（Supabase の設定が必要です）。</p>
  </dialog>

  <script src="config.js?v=dev"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="sync.js?v=dev"></script>
  <script src="app.js?v=dev"></script>
</body>
</html>
