<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>英単語カード</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>英単語カード</h1>
    <span id="remaining" class="remaining">今日の残り <b id="remainingNum">0</b> 枚</span>
  </header>

  <div class="toolbar">
    <span id="breakdown" class="breakdown"></span>
    <button id="shuffleBtn" class="chip">🔀 シャッフル</button>
    <label class="chip">新規/日 <input type="number" id="newLimit" min="0" max="999" inputmode="numeric"></label>
  </div>

  <main>
    <div id="card" class="card" role="button" tabindex="0" aria-label="タップして裏返す">
      <div class="card-inner">
        <div class="face front">
          <p id="phrase" class="phrase"></p>
          <p class="hint">タップして答えを見る</p>
        </div>
        <div class="face back">
          <p id="translation" class="translation"></p>
          <div id="note" class="note"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="grade" class="grade" hidden>
    <button class="btn g-again" data-grade="0">もう一度<small data-preview="0"></small></button>
    <button class="btn g-hard"  data-grade="1">難しい<small data-preview="1"></small></button>
    <button class="btn g-good"  data-grade="2">普通<small data-preview="2"></small></button>
    <button class="btn g-easy"  data-grade="3">簡単<small data-preview="3"></small></button>
  </div>

  <nav id="controls" class="controls">
    <button id="prevBtn" class="btn">← 前へ</button>
    <button id="nextBtn" class="btn primary">次へ →</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
