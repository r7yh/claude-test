name: Update cards from Notion & Deploy

on:
  schedule:
    - cron: '17 18 * * *'   # 毎日 18:17 UTC（日本時間 3:17）
  workflow_dispatch:        # 手動実行ボタン
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Notion から cards.json を生成
        if: github.event_name != 'push'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/fetch-notion.mjs

      - name: 変更があればコミット
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- cards.json; then
            echo "cards.json に変更はありません"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cards.json
            git commit -m "Update cards.json from Notion"
            git push
          fi

      - name: 公開用ファイルをまとめる
        run: |
          mkdir -p _site
          cp index.html style.css app.js cards.json _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
